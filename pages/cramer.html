<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Calculadora Regla de Cramer</title>

    <link rel="stylesheet" href="../assets/css/stylecramer.css">
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <div class="logo-area">
                <div class="logo-box">∑</div>

                <div>
                    <h1>Cramer</h1>
                    <p>Workspace</p>
                </div>
            </div>

            <nav class="sidebar-nav">

                <button onclick="window.location.href='../index.html'" class="nav-item">
                     ⌂ Dashboard
                </button>

                
                <button class="nav-item active-nav">
                    Δ Regla de Cramer
                </button>

            </nav>

            
        </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div class="topbar">

            <div>
                <h2>Regla de Cramer</h2>

                <p>
                    Resolución paso a paso
                </p>
            </div>

        </div>

        <!-- WORKSPACE -->
        <div class="workspace-grid">

            <!-- MATRICES -->
            <div class="matrix-workspace">

                <div class="panel">

                    <div class="controls">

                        <button class="size-btn active" data-size="2">
                            Sistema 2x2
                        </button>

                        <button class="size-btn" data-size="3">
                            Sistema 3x3
                        </button>

                        <button id="calcularBtn">
                            Resolver Sistema
                        </button>

                    </div>

                </div>

                <!-- INPUTS -->
                <div class="matrix-visual-container">

                    <div class="matrix-visual">

                        <div id="inputSection"></div>

                    </div>

                </div>

            </div>

            <!-- DETALLES -->
            <div class="steps-workspace">

                <div class="step-topbar">
                    <h3>Detalles del Cálculo</h3>
                </div>

                <div class="step-card">

                    <p>
                        Ingresa los valores del sistema y presiona
                        "Resolver Sistema" para desplegar el procedimiento
                        completo paso a paso.
                    </p>

                </div>

            </div>

        </div>

        <!-- DIVIDER -->
        <hr class="step-section-divider">

        <!-- RESULTADOS -->
        <div class="detailed-steps-list">

            <div id="resultSection">

                <div class="placeholder">
                    Aquí se mostrarán los pasos detallados para la resolución del sistema.
                </div>

            </div>

        </div>

    </main>

</div>

<script src="../assets/js/cramer/cramer-core.js"></script>

</body>
</html>
