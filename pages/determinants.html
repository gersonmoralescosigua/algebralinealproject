<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Determinantes | LinearAI</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

<div class="app-layout">

  <aside class="sidebar">
    <div>
      <div class="logo-area">
        <div class="logo-box">∑</div>
        <div>
          <h1>LinearAI</h1>
          <p>Workspace</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="../index.html" class="nav-item">⌂ Dashboard</a>
        <a href="#" class="nav-item active-nav">Δ Determinantes</a>
      </nav>
    </div>
  </aside>

  <main class="main-content" x-data="determinantApp()">

    <div class="topbar">
      <div>
        <h2>Determinantes</h2>
        <p>Cálculo paso a paso</p>
      </div>
    </div>

    <div class="workspace-grid">

      <div class="matrix-workspace">

        <div class="panel">
          <div class="controls">

            <select x-model.number="size">
              <option value="2">2x2</option>
              <option value="3">3x3</option>
              <option value="4">4x4</option>
            </select>

            <select x-model="method">
              <option value="auto">Automático</option>
              <option value="sarrus" x-show="size === 3">Sarrus</option>
              <option value="cofactor">Cofactores</option>
            </select>

            <button @click="generateMatrix()">
              Limpiar / Generar
            </button>

            <button @click="calculate()">
              Calcular
            </button>

          </div>
        </div>

        <div class="matrix-visual-container">
          <div class="matrix-visual">
            <template x-for="(row, i) in matrix" :key="'row-'+i">
              <div class="matrix-row">

                <template x-for="(colIndex, visualJ) in getDisplayColumns()" :key="'cell-'+i+'-'+visualJ">
                  <div style="display: contents;">
                    
                    <div 
                      class="matrix-cell"
                      :class="getCellClass(i, visualJ)"
                      :style="getInlineStyle(i, visualJ)"
                    >
                      <input 
                        type="number" 
                        x-model.number="matrix[i][colIndex]"
                        :readonly="visualJ > 2"
                      >
                    </div>

                    <template x-if="visualJ === 2 && getDisplayColumns().length > 3">
                      <div class="sarrus-divider"></div>
                    </template>

                  </div>
                </template>

              </div>
            </template>
          </div>
        </div>

      </div>

      <div class="steps-workspace">

        <div class="step-topbar">
          <h3>Procedimiento</h3>
          <div class="step-controls">
            <button @click="prevStep()" :disabled="steps.length === 0">◀</button>
            <button @click="nextStep()" :disabled="steps.length === 0">▶</button>
          </div>
        </div>

        <div class="step-card">
          <div class="step-number" x-show="steps.length > 0">
            Paso <span x-text="currentStep + 1"></span> de <span x-text="steps.length"></span>
          </div>
          
          <template x-for="(step, index) in steps" :key="'step-'+index">
            <div x-show="index === currentStep">
               <p x-html="step"></p>
            </div>
          </template>
          
          <div x-show="steps.length === 0">
             <p>Ingresa los valores de la matriz y haz clic en "Calcular" para ver el procedimiento paso a paso.</p>
          </div>
        </div>

        <div class="result-card" x-show="result !== null">
          <span>Resultado</span>
          <h2 x-text="result"></h2>
        </div>

      </div>

    </div>

  </main>

</div>

<script src="../assets/js/determinants/determinant-core.js"></script>

</body>
</html>
